name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  DOCKER_REPO: ${{ secrets.DOCKER_USERNAME }}/meraki-assistant

jobs:
  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}:backend-latest
            ${{ env.DOCKER_REPO }}:backend-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}:frontend-latest
            ${{ env.DOCKER_REPO }}:frontend-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### 🐳 Docker images pushed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Backend:** \`${{ env.DOCKER_REPO }}:backend-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend:** \`${{ env.DOCKER_REPO }}:frontend-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to ECS Fargate
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster meraki-assistant-cluster \
            --service meraki-assistant-task-service-8udl3gbv \
            --force-new-deployment \
            --region ap-southeast-2

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster meraki-assistant-cluster \
            --services meraki-assistant-task-service-8udl3gbv \
            --region ap-southeast-2

      - name: Deployment summary
        run: |
          echo "### 🚀 Deployment complete!" >> $GITHUB_STEP_SUMMARY
          echo "ECS service updated successfully." >> $GITHUB_STEP_SUMMARY