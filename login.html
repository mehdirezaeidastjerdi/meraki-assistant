<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meraki AI Assistant — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0e13;
      --surface: #111820;
      --border: #1e2d3d;
      --accent: #00d4ff;
      --accent-dim: rgba(0,212,255,0.1);
      --accent-glow: rgba(0,212,255,0.25);
      --text: #c9d6e3;
      --text-dim: #4a6070;
      --green: #00ff88;
      --red: #ff4d6a;
      --red-dim: rgba(255,77,106,0.1);
    }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      width: 380px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,212,255,0.05);
      animation: appear 0.4s ease;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo {
      width: 42px; height: 42px;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 20px var(--accent-glow);
      flex-shrink: 0;
    }

    .logo svg { width: 20px; height: 20px; }

    .logo-text h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px; font-weight: 500;
      color: var(--accent); letter-spacing: 0.05em;
    }

    .logo-text p {
      font-size: 11px; color: var(--text-dim);
      font-family: 'IBM Plex Mono', monospace;
      margin-top: 2px;
    }

    h2 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 18px; font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px; color: var(--text-dim);
      margin-bottom: 28px; line-height: 1.5;
    }

    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px; color: var(--text-dim);
      letter-spacing: 0.1em; text-transform: uppercase;
      margin-bottom: 7px;
    }

    .field-row {
      display: flex; gap: 8px; align-items: center;
    }

    .field input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .field input::placeholder { color: var(--text-dim); }

    .eye-btn {
      width: 42px; height: 42px; flex-shrink: 0;
      border-radius: 10px; border: 1px solid var(--border);
      background: transparent; color: var(--text-dim);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; font-size: 15px;
    }

    .eye-btn:hover { border-color: var(--accent); color: var(--accent); }

    .error-msg {
      display: none;
      align-items: center; gap: 8px;
      padding: 10px 14px;
      background: var(--red-dim);
      border: 1px solid rgba(255,77,106,0.25);
      border-radius: 8px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px; color: var(--red);
      margin-bottom: 16px;
    }

    .error-msg.visible { display: flex; }

    .login-btn {
      width: 100%; padding: 13px;
      border-radius: 10px; border: none;
      background: var(--accent); color: var(--bg);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
      box-shadow: 0 0 20px var(--accent-glow);
      margin-top: 4px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    .login-btn:hover { background: #33ddff; }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: var(--bg);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card">
  <div class="logo-wrap">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#00d4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
      </svg>
    </div>
    <div class="logo-text">
      <h1>MERAKI AI ASSISTANT</h1>
      <p>Powered by Claude + Meraki API</p>
    </div>
  </div>

  <h2>Welcome back</h2>
  <p class="subtitle">Sign in to access your network assistant.</p>

  <div class="error-msg" id="errorMsg">
    ✕ <span id="errorText">Incorrect username or password</span>
  </div>

  <div class="field">
    <label>Username</label>
    <input type="text" id="username" placeholder="admin" autocomplete="username" onkeydown="handleKey(event)"/>
  </div>

  <div class="field">
    <label>Password</label>
    <div class="field-row">
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" onkeydown="handleKey(event)"/>
      <button class="eye-btn" onclick="togglePass(this)">👁</button>
    </div>
  </div>

  <button class="login-btn" id="loginBtn" onclick="doLogin()">
    <div class="spinner" id="spinner"></div>
    <span id="btnText">Sign In</span>
  </button>
</div>

<script>
  // If already logged in, go straight to chat
  if (localStorage.getItem('jwt_token')) {
    verifyAndRedirect();
  }

  async function verifyAndRedirect() {
    const token = localStorage.getItem('jwt_token');
    try {
      const res = await fetch('/auth/me', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) window.location.href = '/chat-ui';
      else localStorage.removeItem('jwt_token');
    } catch {
      localStorage.removeItem('jwt_token');
    }
  }

  function handleKey(e) {
    if (e.key === 'Enter') doLogin();
  }

  function togglePass(btn) {
    const input = document.getElementById('password');
    const isPass = input.type === 'password';
    input.type = isPass ? 'text' : 'password';
    btn.textContent = isPass ? '🙈' : '👁';
  }

  function setLoading(on) {
    document.getElementById('loginBtn').disabled = on;
    document.getElementById('spinner').style.display = on ? 'block' : 'none';
    document.getElementById('btnText').textContent = on ? 'Signing in...' : 'Sign In';
  }

  function showError(msg) {
    document.getElementById('errorText').textContent = msg;
    document.getElementById('errorMsg').classList.add('visible');
  }

  function hideError() {
    document.getElementById('errorMsg').classList.remove('visible');
  }

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      showError('Please enter your username and password.');
      return;
    }

    hideError();
    setLoading(true);

    try {
      // OAuth2 form requires application/x-www-form-urlencoded
      const body = new URLSearchParams({ username, password });
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString()
      });

      const data = await res.json();

      if (!res.ok) {
        showError(data.detail || 'Login failed. Please try again.');
        return;
      }

      localStorage.setItem('jwt_token', data.access_token);
      localStorage.setItem('username', data.username);
      window.location.href = '/chat-ui';

    } catch {
      showError('Could not connect to server. Is it running?');
    } finally {
      setLoading(false);
    }
  }
</script>
</body>
</html>
